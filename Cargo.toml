[package]
name = "ai-overlay"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.ollama-rs]
#version = "0.2"
path = "../ollama-rs/"
features = ["chat-history"]

[dependencies.iced]
version = "0.13.1"
features = ["tokio", "fira-sans", "svg"]
